[project]
name = "radius-platform-backend"
version = "0.1.0"
description = "Data Plus Lebanon ISP platform backend: policy engine, billing, RADIUS integration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "argon2-cffi>=23.1",
    "clickhouse-connect>=0.8",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "freezegun>=1.5",
    "ruff>=0.7",
    "pyrad>=2.4",  # RADIUS wire-protocol client, for the docker-based FreeRADIUS integration test
]
# One-time legacy import (Part F), flag-gated and quarantined after cutover —
# kept out of the base dependency set so a normal `pip install .` for the
# running platform never pulls in the AES envelope / legacy-API-client code
# path at all.
import-legacy = [
    "pycryptodome>=3.20",  # OpenSSL/CryptoJS-compatible AES envelope, see import_legacy/crypto.py
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "import_legacy/tests"]

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = ["app", "import_legacy"]
