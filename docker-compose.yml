
# Data Plus Lebanon ISP platform.
# NOTE: this compose file is meant to be run on the actual deploy host
# (Proxmox/LXC, HP DL380 Gen9). It has not been run from this build session —
# there is no docker daemon and no network path to production reachable here.
# Bring it up with: docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radius_platform}
      POSTGRES_USER: ${POSTGRES_USER:-radius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radius}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: radius_telemetry
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-radius}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./backend/clickhouse:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment: &engine_env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-radius}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:-radius_platform}
      REDIS_URL: redis://redis:6379/0
      CLICKHOUSE_URL: http://clickhouse:8123
      AUTHZ_FAIL_MODE: ${AUTHZ_FAIL_MODE:-closed}
      RADIUS_CLIENTS_PATH: /etc/freeradius-clients/nas.conf
    # Migrations run here, once, before the API takes traffic; the worker
    # waits for this service to be healthy.
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - radius_clients:/etc/freeradius-clients
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
    # Loopback only. /radius/* has no auth of its own — it's for the
    # freeradius container. Atlas reaches /api/v1 through Caddy.
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment: *engine_env
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_healthy

  freeradius:
    build: ./radius
    restart: unless-stopped
    environment:
      RLM_REST_BASE_URL: http://backend:8000
    volumes:
      # Bind-mounted for fast iteration; the Dockerfile also COPYs these so a
      # plain image build is complete on its own.
      - ./radius/sites-enabled/default:/etc/raddb/sites-enabled/default:ro
      - ./radius/mods-enabled/rest:/etc/raddb/mods-enabled/rest:ro
      # NAS client list rendered by the backend from nas_devices.
      - radius_clients:/etc/freeradius-clients:ro
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
      # CoA/Disconnect-Requests are *originated* by the backend/worker toward
      # the NAS fleet (app/actuation/coa.py), so nothing listens on 3799 here.
      # The NAS must list this host under /radius for CoA to be accepted.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ENGINE_API_SITE: ${ENGINE_API_SITE:-localhost:8443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports:
      - "8443:8443"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  caddy_data:
  radius_clients:
