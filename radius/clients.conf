# Static clients: only localhost, for radtest / health checks from inside the
# container. Every real NAS comes from the engine's NAS inventory (Atlas >
# FreeRADIUS > NAS), rendered by the backend into the shared file included
# below. The entrypoint creates it empty on first boot and restarts radiusd
# whenever its contents change (FreeRADIUS 3 doesn't reload clients on HUP).
#
# This engine is fully separate from SAS4: register only the PPPoE servers
# whose subscribers live here.

client localhost {
	ipaddr = 127.0.0.1
	secret = testing123
	require_message_authenticator = no
	nas_type = other
}

$INCLUDE /etc/freeradius-clients/nas.conf
