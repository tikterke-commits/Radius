# Static clients for initial bring-up. Each entry here must have a matching
# row in nas_devices (app/models/nas.py) so the platform's own view of "which
# NAS devices exist" and FreeRADIUS's view stay in sync — this file is
# hand-maintained for now.
#
# TODO once the RouterOS actuation layer (B4) exists: switch to rlm_sql's
# dynamic client loading (`read_clients = yes` against a clients-shaped view
# over nas_devices) so adding a NAS is a platform operation, not a config
# file + FreeRADIUS restart. Not done in this pass — flagging rather than
# half-building it.

client localhost {
	ipaddr = 127.0.0.1
	secret = testing123
	require_message_authenticator = no
	nas_type = other
}

# Example MikroTik BNG entry — replace with real fleet IPs/secrets before
# any real deployment. Secrets belong in an untracked override file or a
# secrets manager, never committed in cleartext once real values are used.
client bng1_example {
	ipaddr = 10.140.140.0/24
	secret = "CHANGE_ME_BEFORE_DEPLOY"
	nas_type = other
	# CoA/Disconnect-Request destination for this NAS — see
	# radius/sites-enabled/default's post-auth for how Mikrotik-Rate-Limit
	# changes are pushed mid-session.
}
